spring:
  application:
    name: spring-ai-debate-arquitetura
  ai:
    model:
      # google-genai (padrão), anthropic ou openai (qualquer API compatível com a da OpenAI)
      chat: ${CHAT_PROVIDER:google-genai}
      embedding:
        text: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.8-flash
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          # Claude Opus 5 não aceita temperature (400), por isso ela não é definida aqui.
          model: claude-opus-5
          max-tokens: 16000
    # Também serve para roteadores e provedores compatíveis: 9router, OpenRouter, DeepSeek, Ollama.
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        model: ${MODELO_A:gpt-5.5}
        # O ADR do árbitro pode passar de um minuto em modelos de raciocínio.
        timeout: 180s

app:
  debate:
    # Com Claude, defina os três como claude-opus-5 (ou outro modelo Claude).
    modelo-arbitro: ${MODELO_ARBITRO:gemini-3.1-pro-preview}
    modelo-a: ${MODELO_A:gemini-3.8-flash}
    modelo-b: ${MODELO_B:gemini-3.5-flash}
    rodadas-maximas: 3
    limite-eco: 0.6
    # Opcional: endereço próprio por papel (API compatível com a da OpenAI), para pôr provedores
    # diferentes no mesmo debate. Sem URL, o papel usa o provedor de CHAT_PROVIDER.
    endpoints:
      arbitro:
        base-url: ${URL_ARBITRO:}
        api-key: ${CHAVE_ARBITRO:}
      a:
        base-url: ${URL_A:}
        api-key: ${CHAVE_A:}
      b:
        base-url: ${URL_B:}
        api-key: ${CHAVE_B:}

server:
  port: ${PORT:8080}
